name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms rather than stopping at the first red one: a
      # failure on one OS is usually the interesting result, not a reason to
      # hide the other.
      fail-fast: false
      matrix:
        # Windows is deliberate, not symmetry. Developers here work on Windows, so it has to be a gate and not an afterthought.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: onejs-react

    steps:
      # Checked out into a named folder so the siblings below sit beside it.
      # onejs-react depends on them through "file:../" specifiers, which is the layout
      # the packages are developed in inside the container repo; a lone checkout
      # resolves none of them and fails before any test runs.
      - uses: actions/checkout@v4
        with:
          path: onejs-react

      - uses: actions/checkout@v4
        with:
          repository: Singtaa/unity-types
          ref: main
          path: unity-types

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: onejs-react/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # The gate above checks these sources under this repo's tsconfig, which
      # sets strict and emits nothing. No consumer compiles them that way: this
      # package ships raw TypeScript, so the compiler that reads it belongs to
      # somebody else and is configured by them. This step checks src the way
      # PlaySite's gen-oj-types actually does, non-strict and emitting
      # declarations, which is a genuinely different set of errors and not a
      # slower repeat of the line above. 0.1.56 passed typecheck, lint and 328
      # tests while being unusable by the one consumer that reads it.
      - run: npm run typecheck:consumer

      - run: npm run lint --if-present

      # --if-present: a package with no test script yet is not a failure here,
      # so this workflow starts gating tests the day they are added.
      - run: npm run test --if-present
